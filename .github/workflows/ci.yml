# Checks every push and pull request. A tag vX.Y.Z also packages the skill and drafts a release
# with obsidian-plugin-publish.skill and a build-provenance attestation.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check.py ${{ startsWith(github.ref, 'refs/tags/') && format('--tag {0}', github.ref_name) || '' }}
      - run: bash -n skills/obsidian-plugin-publish/scripts/obsidian_eval.sh
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: skill
          path: dist/obsidian-plugin-publish.skill

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: skill
          path: dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/obsidian-plugin-publish.skill
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft --notes-file notes.md dist/obsidian-plugin-publish.skill
